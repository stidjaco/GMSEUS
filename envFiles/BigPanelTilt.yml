# pvlib environment for script8 (optimal tilt).
# Setup (from the repository root):
#   mamba env create -f envFiles/BigPanelTilt.yml
#   mamba activate BigPanelTilt
#   pip install -e .      # editable install of utils/ (gmseusUtils, osmUtils); see README
name: BigPanelTilt
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy=2.0.2
  - pandas=2.2.3
  - geopandas=1.0.1
  - shapely=2.0.6
  - pyproj=3.7.0
  - pyogrio=0.10.0
  - scipy=1.15.1
  - scikit-learn=1.6.1
  - statsmodels=0.14.4
  - numba=0.60.0
  - ephem=4.1.6
  - h5py=3.12.1
  - pvlib=0.11.2
  - matplotlib-base=3.10.0
  - folium=0.19.4
  - mapclassify=2.8.1
  - requests=2.32.3
  - ipykernel=6.29.5
  - ca-certificates
  - certifi
  - openssl
  - pip
